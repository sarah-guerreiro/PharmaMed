{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}

<div class="container my-5">
    <div class="row">
        <div class="register-form col-12 col-md-6 pe-md-5">
            
            <!-- Register form -->
            {% include "components/register_form.html"%}

        </div>

        <!-- Login link -->
        <div class="col-12 col-md-6 mt-5 mt-md-0 ps-md-5">
            <div class="login-link pb-1 mb-4">
                <h2 class="fs-4">Already have an account?</h2>
            </div>
            <div class="pt-2">
                <a href="{{ url_for('auth.login') }}" class="btn action-btn ms-3">Login</a>
            </div>   
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/forms.js') }}"></script>
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>

{% endblock %}
