{% extends "layout.html" %}

{% block title %}
    Account
{% endblock %}

{% block main %}

<div class="container my-5">
    <div class="row">

        <!-- Sidebar, desktop and tablets -->
        <div id="accountSidebar" class="col-3 d-none d-md-block">
            <div class="list-group shadow-sm">
                <a href="{{ url_for('profile') }}" class="list-group-item list-group-item-action d-flex align-items-center {% if active_page == 'profile' %}active{% endif %}">
                    <i class="fa-solid fa-address-card me-2"></i>Profile
                </a>
                <a href="{{ url_for('orders') }}" class="list-group-item list-group-item-action d-flex align-items-center {% if active_page == 'orders' %}active{% endif %}">
                    <i class="fa-solid fa-box-open me-2"></i>Orders
                </a>
                <a href="{{ url_for('change_password') }}" class="list-group-item list-group-item-action d-flex align-items-center {% if active_page == 'security' %}active{% endif %}">
                    <i class="fa-solid fa-shield-halved me-2"></i>Security
                </a>
            </div>
        </div>

        <!-- Tabs, smartphone only -->
        <div class="mb-3 d-md-none">
            <ul class="nav nav-tabs d-flex w-100 text-center mb-4">

                <!-- Profile tab -->
                <li class="nav-item flex-fill">
                    <a href="{{ url_for('profile') }}" class="nav-link w-100 {% if active_page == 'profile' %}active{% endif %}" >
                        Profile
                    </a>
                </li>

                <!-- Orders tab -->
                <li class="nav-item flex-fill">
                    <a href="{{ url_for('orders') }}" class="nav-link w-100 {% if active_page == 'orders' %}active{% endif %}">
                        Orders
                    </a>
                </li>

                <!-- Security tab -->
                <li class="nav-item flex-fill">
                    <a href="{{ url_for('change_password') }}" class="nav-link w-100 {% if active_page == 'security' %}active{% endif %}">
                        Security
                    </a>
                </li>

            </ul>
        </div>

        <!-- Main content -->
        <div class="col-12 col-md-9">
            <div class="main-content mx-2 ms-md-5">
                {% block account_content %}{% endblock %}  
            </div>
        </div>
    </div>
</div>

{% endblock %}
