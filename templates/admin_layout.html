<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        
        <!-- Bootstrap CDN link -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- https://favicon.io/emoji-favicons/pill -->
         <link href="/static/favicon.ico" rel="icon">

         <!-- Font Awesome CDN link -->
         <script src="https://kit.fontawesome.com/9574363136.js" crossorigin="anonymous"></script>
         
        <link href="/static/styles.css" rel="stylesheet">

        <title>{% block title %}{% endblock %}</title>
    </head>

    <body class="d-flex flex-column min-vh-100">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-md sticky-top" data-bs-theme="dark">
            <div class="container-fluid flex-wrap flex-md-nowrap align-items-center">
                
                <!-- Brand -->
                <div class="d-flex align-items-center">
                    <a class="navbar-brand" href="{{ url_for('admin_home') }}">
                        <i class="fa-solid fa-pills fa-lg me-2"></i>PharmaMed | Admin
                    </a>
                </div>

                <!-- Logout icon -->
                <ul class="navbar-nav flex-row align-items-center">
                    <li class="nav-item d-flex flex-column text-center">
                        <form action="{{ url_for('admin_logout') }}" method="post" class="d-inline">
                            <button class="nav-link btn btn-link" type="submit">
                                <i class="fa-solid fa-right-from-bracket fa-lg"></i>
                                <span class="d-none d-md-block small">Logout</span>
                            </button>
                        </form>
                    </li>
                </ul>

            </div>
        </nav>

        <!-- Flash messages -->
        <div class="flash-messages w-100">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else ('info' if category == 'persistent' else category) }} alert-dismissible fade 
                    d-flex align-items-center justify-content-center" role="alert" data-persistent="{{ 'true' if category == 'persistent' else 'false' }}">
                        {{ message | safe }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        </div>

        <main class="flex-grow-1">
            {% block main %}{% endblock %}
        </main>

        <footer>

            <div class="footer-bottom mt-3">
                <p id="copyright"></p> 
            </div>

        </footer>

        <script>

            document.addEventListener("DOMContentLoaded", function() {

                // Trigger smooth fade in effect for flash messages
                document.querySelectorAll('.alert').forEach(alert => {
                    setTimeout(() => {
                        alert.classList.add('show');
                    }, 100);
                });
                
                // Auto-dismiss flash messages after 6 seconds
                setTimeout(() => {
                    document.querySelectorAll('.alert').forEach(alert => {

                        // Skip for persistent alerts
                        if (alert.dataset.persistent === 'true') return;

                        alert.classList.remove('show');

                        setTimeout(() => {
                            alert.remove();
                        }, 500);
                        
                    });
                }, 6000);

                // Set current year on copyright
                document.getElementById("copyright").innerHTML = new Date().getFullYear() + " | PharmaMed. All rights reserved.";
            });

            function addFlashMessage(message, category) {

                const container = document.querySelector('.flash-messages');

                const alertDiv = document.createElement('div');

                let alertClass = category === 'error' ? 'danger' : (category === 'persistent' ? 'info' : category);

                alertDiv.className = `alert alert-${alertClass} alert-dismissible fade d-flex align-items-center justify-content-center`;

                alertDiv.setAttribute('role', 'alert');
                alertDiv.dataset.persistent = (category === 'persistent') ? 'true' : 'false';

                alertDiv.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;

                container.appendChild(alertDiv);

                // Trigger smooth fade in effect
                setTimeout(() => {
                    alertDiv.classList.add('show');
                }, 100);

                // Auto-dismiss flash messages after 6 seconds
                if (alertDiv.dataset.persistent !== 'true') {
                    setTimeout(() => {
                        alertDiv.classList.remove('show');
                        setTimeout(() => alertDiv.remove(), 500);
                    }, 6000);
                }
            }
        
        </script>

    </body>
    
</html>
